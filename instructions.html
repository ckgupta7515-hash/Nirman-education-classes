<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instructions</title>

<style>

body {
font-family: 'Segoe UI', sans-serif;
margin: 0;
background: linear-gradient(135deg,#004aad,#00c6ff);
}

/* Header */

.header {

color: white;

text-align: center;

padding: 20px;

font-size: 22px;

font-weight: bold;

}

/* White Box */

.main-box {

background: white;

border-radius: 25px 25px 0 0;

padding: 20px;

min-height: 90vh;

}

/* Instruction List */

.instructions {

font-size: 15px;

line-height: 1.7;

color: #333;

margin-bottom: 20px;

}

/* Start Button */

.start-btn {

background: linear-gradient(135deg,#4caf50,#2e7d32);

color: white;

border: none;

padding: 14px;

border-radius: 12px;

font-size: 16px;

cursor: pointer;

width: 100%;

font-weight: bold;

}

.start-btn:hover {

opacity: 0.9;

}

/* Checkbox */

.agree {

margin-bottom: 15px;

font-size: 14px;

}

</style>

</head>

<body>

<div class="header">

Test Instructions

</div>

<div class="main-box">

<div class="instructions">

<b>📋 Please Read Instructions Carefully:</b>

<ul>

<li>Total Questions: <b>50</b></li>

<li>Total Time: <b>50 Minutes</b></li>

<li>Each Correct Answer: <b>+1 Mark</b></li>

<li>Each Wrong Answer: <b>-0.25 Mark</b></li>

<li>Do not refresh page during test</li>

<li>Test will auto submit when time ends</li>

<li>Click Submit after finishing test</li>

</ul>

</div>

<div class="agree">

<input type="checkbox" id="agree">

<label for="agree">

I have read all instructions carefully

</label>

</div>

<button class="start-btn"

onclick="startTest()">

▶ Start Test Now

</button>

</div>

<script>

function startTest(){

let check = document.getElementById("agree");

if(!check.checked){

alert("Please accept instructions first");

return;

}

window.location.href = "test.html";

}

</script>

</body>
</html>
