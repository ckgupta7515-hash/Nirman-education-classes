<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapters</title>

<style>

body {
font-family: 'Segoe UI', sans-serif;
margin: 0;
background: linear-gradient(135deg,#004aad,#00c6ff);
}

.header {
color: white;
text-align: center;
padding: 20px;
font-size: 22px;
font-weight: bold;
}

.main-box {
background: white;
border-radius: 25px 25px 0 0;
padding: 18px;
min-height: 90vh;
}

.chapter-card {

background: linear-gradient(135deg,#f9fbff,#eef3ff);

padding: 16px;

border-radius: 14px;

margin-bottom: 14px;

box-shadow: 0 6px 14px rgba(0,0,0,0.15);

}

.chapter-name {

font-size: 17px;

font-weight: bold;

color: #004aad;

margin-bottom: 5px;

}

.details {

font-size: 13px;

color: #555;

display: flex;

justify-content: space-between;

margin-bottom: 8px;

}

.start-btn {

background: linear-gradient(135deg,#4caf50,#2e7d32);

color: white;

border: none;

padding: 10px;

border-radius: 10px;

font-size: 14px;

cursor: pointer;

width: 100%;

}

</style>

</head>

<body>

<div class="header">
Maths Chapters
</div>

<div class="main-box" id="chapterList">
</div>

<script>

/* Chapter Name + File Link */

const mathsChapters = [

{ name:"Percentage",
file:"percentage-test.html" },

{ name:"Profit Loss",
file:"profit-loss-test.html" },

{ name:"Ratio and Proportion",
file:"ratio-test.html" },

{ name:"LCM & HCF",
file:"lcm-hcf-test.html" },

{ name:"Average",
file:"average-test.html" },

{ name:"Time and Work",
file:"time-work-test.html" },

{ name:"Pipes and Cisterns",
file:"pipes-test.html" },

{ name:"Time and Distance",
file:"time-distance-test.html" },

{ name:"Boat and Streams",
file:"boat-test.html" },

{ name:"Algebra",
file:"algebra-test.html" },

{ name:"Trigonometry",
file:"trigonometry-test.html" },

{ name:"Mensuration",
file:"mensuration-test.html" },

{ name:"Geometry",
file:"geometry-test.html" },

{ name:"Number System",
file:"number-system-test.html" },

{ name:"Statistics and DI",
file:"statistics-test.html" },

{ name:"Probability",
file:"probability-test.html" },

{ name:"Sequence and Series",
file:"sequence-test.html" },

{ name:"Allegation or Mixture",
file:"allegation-test.html" },

{ name:"SI & CI",
file:"si-ci-test.html" },

{ name:"Power and Indices",
file:"power-test.html" },

{ name:"Simplification",
file:"simplification-test.html" }

];

/* Load Chapters */

mathsChapters.forEach(function(chapter){

let div =
document.createElement("div");

div.className =
"chapter-card";

div.innerHTML = `

<div class="chapter-name">
📘 ${chapter.name}
</div>

<div class="details">

<span>📝 50 Questions</span>

<span>⏱ 50 Minutes</span>

</div>

<button class="start-btn"

onclick="openTest('${chapter.file}')">

Start Test

</button>

`;

document.getElementById("chapterList")

.appendChild(div);

});

/* Open Test */

function openTest(file){

window.location.href = file;

}

</script>

</body>
</html>
